# Postgres para desarrollo y tests en local. Credenciales de prueba, solo para
# esta máquina: producción usa docker-compose.dokploy.yml con las suyas.
services:
  postgres:
    image: postgres:16-alpine
    container_name: bambu-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: bambu
      POSTGRES_PASSWORD: bambu_local
      POSTGRES_DB: bambu
    ports:
      - "5438:5432"
    volumes:
      - bambu_datos_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bambu_datos_local:
