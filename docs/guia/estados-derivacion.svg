<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 680" width="820" height="680" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <!-- Estados de una derivación y quién la mueve. Solo líneas horizontales y verticales. -->
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#344b3b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="680" fill="#fffdf8"/>

  <!-- Camino principal -->
  <rect x="70" y="20" width="260" height="56" rx="10" fill="#f0e8d9" stroke="#5b665c" stroke-width="1.5"/>
  <text x="200" y="43" text-anchor="middle" fill="#27372d" font-weight="bold">«Esborrany»</text>
  <text x="200" y="62" text-anchor="middle" fill="#5b665c">borrador: solo lo ve quien lo escribe</text>

  <rect x="70" y="150" width="260" height="56" rx="10" fill="#ffffff" stroke="#344b3b" stroke-width="1.5"/>
  <text x="200" y="173" text-anchor="middle" fill="#27372d" font-weight="bold">«Nova»</text>
  <text x="200" y="192" text-anchor="middle" fill="#5b665c">enviada: Bambú la tiene que mirar</text>

  <rect x="70" y="280" width="260" height="56" rx="10" fill="#ffffff" stroke="#344b3b" stroke-width="1.5"/>
  <text x="200" y="303" text-anchor="middle" fill="#27372d" font-weight="bold">«Pendent de cita»</text>
  <text x="200" y="322" text-anchor="middle" fill="#5b665c">aceptada: falta la cita en Wakyma</text>

  <rect x="70" y="410" width="260" height="56" rx="10" fill="#ffffff" stroke="#344b3b" stroke-width="1.5"/>
  <text x="200" y="433" text-anchor="middle" fill="#27372d" font-weight="bold">«En tractament»</text>
  <text x="200" y="452" text-anchor="middle" fill="#5b665c">ya tiene cita: el animal viene</text>

  <rect x="70" y="540" width="260" height="56" rx="10" fill="#e7f0e3" stroke="#2f5f35" stroke-width="1.5"/>
  <text x="200" y="563" text-anchor="middle" fill="#27372d" font-weight="bold">«Alta»</text>
  <text x="200" y="582" text-anchor="middle" fill="#5b665c">tratamiento acabado</text>

  <!-- Salidas laterales -->
  <rect x="540" y="150" width="240" height="56" rx="10" fill="#f9e7e1" stroke="#a3261c" stroke-width="1.5"/>
  <text x="660" y="173" text-anchor="middle" fill="#27372d" font-weight="bold">«Rebutjada»</text>
  <text x="660" y="192" text-anchor="middle" fill="#5b665c">no se acepta, con el motivo</text>

  <rect x="540" y="345" width="240" height="56" rx="10" fill="#f9e7e1" stroke="#a3261c" stroke-width="1.5"/>
  <text x="660" y="368" text-anchor="middle" fill="#27372d" font-weight="bold">«Tancada»</text>
  <text x="660" y="387" text-anchor="middle" fill="#5b665c">no contesta, no viene…, con motivo</text>

  <!-- Flechas del camino principal -->
  <g stroke="#344b3b" stroke-width="1.5" fill="none" marker-end="url(#flecha)">
    <line x1="200" y1="76" x2="200" y2="150"/>
    <line x1="200" y1="206" x2="200" y2="280"/>
    <line x1="200" y1="336" x2="200" y2="410"/>
    <line x1="200" y1="466" x2="200" y2="540"/>
    <line x1="330" y1="178" x2="540" y2="178"/>
    <polyline points="330,300 480,300 480,373 540,373"/>
  </g>
  <polyline points="330,446 480,446 480,373" stroke="#344b3b" stroke-width="1.5" fill="none"/>

  <!-- Quién mueve cada paso -->
  <text x="214" y="118" fill="#344b3b">Veterinario: «Envia la derivació»</text>
  <text x="214" y="248" fill="#344b3b">Bambú: «Accepta» (y elige fisio, si quiere)</text>
  <text x="214" y="378" fill="#344b3b">Bambú: «Ja té cita» (dada en Wakyma)</text>
  <text x="214" y="508" fill="#344b3b">Bambú: «Alta»</text>
  <text x="435" y="170" text-anchor="middle" fill="#a3261c">Bambú: «Rebutja»</text>
  <text x="405" y="292" text-anchor="middle" fill="#a3261c">Bambú: «Tanca»</text>
  <text x="405" y="438" text-anchor="middle" fill="#a3261c">Bambú: «Tanca»</text>

  <!-- Notas -->
  <line x1="40" y1="622" x2="780" y2="622" stroke="#dfe3d8" stroke-width="1"/>
  <text x="40" y="645" fill="#5b665c">Si pasan 3 días en «Pendent de cita», sale en «Encallades» y el equipo recibe un aviso (una vez).</text>
  <text x="40" y="665" fill="#5b665c">Los informes se hacen en Wakyma y se cuelgan en el hilo. No hay reapertura: si vuelve, derivación nueva.</text>
</svg>
