# Postgres para desarrollo y tests en local: docker compose -f docker-compose.local.yml up -d
# esta máquina. Producción usa docker-compose.yml (Dokploy) con las suyas.
services:
  postgres:
    image: postgres:16-alpine
    container_name: bambu-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: bambu
      POSTGRES_PASSWORD: bambu_local
      POSTGRES_DB: bambu
    ports:
      - "5438:5432"
    volumes:
      - bambu_datos_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bambu_datos_local:
